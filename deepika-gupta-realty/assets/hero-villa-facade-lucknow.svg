<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img"
     aria-label="Illustration of a contemporary villa facade at golden hour, with a reflecting water court, stepping-stone approach and landscaped lawn">
  <title>Contemporary villa facade at golden hour with a reflecting water court</title>
  <defs>
    <linearGradient id="hv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD3AC"/>
      <stop offset=".34" stop-color="#F6E5CB"/>
      <stop offset=".68" stop-color="#FAF2E6"/>
      <stop offset="1" stop-color="#E9EDE4"/>
    </linearGradient>
    <radialGradient id="hv-sun" cx=".75" cy=".17" r=".46">
      <stop offset="0" stop-color="#FFEBC4" stop-opacity=".98"/>
      <stop offset=".42" stop-color="#FBDCA4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FBDCA4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hv-wall" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FEFCF7"/>
      <stop offset=".55" stop-color="#F4ECDE"/>
      <stop offset="1" stop-color="#E4D6BE"/>
    </linearGradient>
    <linearGradient id="hv-wall2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDE2CE"/>
      <stop offset="1" stop-color="#DCCCB2"/>
    </linearGradient>
    <linearGradient id="hv-glass" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#0C2B21"/>
      <stop offset=".5" stop-color="#1B4E3C"/>
      <stop offset="1" stop-color="#0A241C"/>
    </linearGradient>
    <linearGradient id="hv-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE2A8"/>
      <stop offset="1" stop-color="#F3BF63"/>
    </linearGradient>
    <linearGradient id="hv-lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFDBC7"/>
      <stop offset="1" stop-color="#B2C4AA"/>
    </linearGradient>
    <linearGradient id="hv-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E9C90"/>
      <stop offset=".35" stop-color="#5E8175"/>
      <stop offset="1" stop-color="#3E5C52"/>
    </linearGradient>
    <linearGradient id="hv-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE5D3"/>
      <stop offset="1" stop-color="#D8C9AF"/>
    </linearGradient>
    <radialGradient id="hv-vig" cx=".5" cy=".45" r=".78">
      <stop offset=".55" stop-color="#3A2E18" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2E18" stop-opacity=".2"/>
    </radialGradient>
    <filter id="hv-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="hv-blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="hv-frame"><rect width="1200" height="860"/></clipPath>
    <clipPath id="hv-pool"><rect x="0" y="702" width="1200" height="158"/></clipPath>
  </defs>

  <g clip-path="url(#hv-frame)">
    <rect width="1200" height="860" fill="url(#hv-sky)"/>
    <circle cx="900" cy="152" r="60" fill="#FFEFCE" opacity=".9"/>
    <rect width="1200" height="860" fill="url(#hv-sun)"/>

    <!-- cloud bands -->
    <g fill="#FFFFFF" opacity=".46">
      <ellipse cx="238" cy="126" rx="200" ry="22"/>
      <ellipse cx="356" cy="100" rx="124" ry="14"/>
      <ellipse cx="640" cy="196" rx="164" ry="16"/>
    </g>

    <!-- layered tree lines for depth -->
    <path d="M0 452c66-26 100 6 146-10s76-30 128-14 82 28 138 6 100-24 158-2 96 24 154 4 116-28 178-4l98 38v56H0z"
          fill="#A9BCA4" opacity=".55"/>
    <path d="M0 492c78-22 114 10 166-6s90-26 146-8 88 24 148 2 104-20 164 0 100 22 160 2 124-20 190 6l86 34v40H0z"
          fill="#84A07E" opacity=".6"/>
    <path d="M0 540c92-18 132 12 190-4s98-22 158-6 96 22 160 2 112-18 176 2 108 20 172 2 132-18 202 8l70 26v52H0z"
          fill="#5E7F5B" opacity=".45"/>

    <!-- lawn -->
    <rect x="0" y="592" width="1200" height="270" fill="url(#hv-lawn)"/>
    <path d="M0 592h1200v10H0z" fill="#9DB396" opacity=".55"/>

    <!-- boundary wall + railing, left -->
    <g>
      <rect x="0" y="520" width="146" height="74" fill="url(#hv-wall2)"/>
      <rect x="0" y="510" width="158" height="13" rx="4" fill="#F4EADA"/>
      <g stroke="#123A2C" stroke-width="5" opacity=".85" stroke-linecap="round">
        <path d="M20 508v-44M50 508v-44M80 508v-44M110 508v-44M140 508v-44"/>
      </g>
      <rect x="0" y="456" width="158" height="8" rx="4" fill="#B0854A"/>
      <rect x="146" y="440" width="26" height="154" rx="4" fill="#E7DAC2"/>
      <rect x="142" y="432" width="34" height="12" rx="5" fill="#F4EADA"/>
    </g>

    <!-- ground shadow -->
    <ellipse cx="600" cy="620" rx="400" ry="30" fill="#7C8F78" opacity=".42" filter="url(#hv-soft)"/>

    <!-- right wing -->
    <g>
      <rect x="812" y="398" width="242" height="206" fill="url(#hv-wall2)"/>
      <rect x="798" y="384" width="270" height="18" rx="6" fill="#FBF5EA"/>
      <rect x="840" y="432" width="78" height="118" rx="3" fill="url(#hv-glass)"/>
      <rect x="934" y="432" width="94" height="118" rx="3" fill="url(#hv-glass)"/>
      <rect x="840" y="432" width="78" height="118" rx="3" fill="#FFFFFF" opacity=".1"/>
      <rect x="836" y="426" width="196" height="5" rx="2.5" fill="#B0854A" opacity=".75"/>
      <rect x="812" y="572" width="242" height="32" fill="#D6C5A9"/>
    </g>

    <!-- main mass -->
    <g>
      <rect x="196" y="378" width="622" height="226" fill="url(#hv-wall)"/>
      <rect x="186" y="572" width="642" height="32" fill="#DCCBAF"/>
      <rect x="230" y="216" width="556" height="164" fill="url(#hv-wall)"/>

      <!-- cantilever slabs -->
      <rect x="204" y="360" width="630" height="24" rx="7" fill="#FFFDF8"/>
      <rect x="212" y="198" width="616" height="22" rx="7" fill="#FFFDF8"/>
      <rect x="204" y="384" width="630" height="6" fill="#CBB99C" opacity=".8"/>
      <!-- cove light strips -->
      <rect x="216" y="356" width="606" height="4" rx="2" fill="#F3D08A" opacity=".85"/>
      <rect x="224" y="194" width="592" height="4" rx="2" fill="#F3D08A" opacity=".8"/>

      <!-- upper glazing -->
      <rect x="264" y="238" width="288" height="120" rx="3" fill="url(#hv-glass)"/>
      <rect x="264" y="238" width="288" height="120" rx="3" fill="#FFFFFF" opacity=".08"/>
      <g stroke="#F4EADA" stroke-width="3" opacity=".5">
        <path d="M360 238v120M456 238v120M264 298h288"/>
      </g>
      <path d="M264 238h96l-64 120h-32z" fill="#FFFFFF" opacity=".1"/>
      <!-- upper warm room + balcony -->
      <rect x="578" y="238" width="182" height="120" rx="3" fill="url(#hv-warm)"/>
      <g stroke="#E4AE5C" stroke-width="3" opacity=".75"><path d="M669 238v120"/></g>
      <rect x="566" y="352" width="206" height="7" rx="3.5" fill="#B0854A"/>
      <g stroke="#B0854A" stroke-width="5" opacity=".9" stroke-linecap="round">
        <path d="M572 380v-26M772 380v-26M622 380v-26M722 380v-26"/>
      </g>

      <!-- gold louvre fins -->
      <g fill="#C79A55" opacity=".7">
        <rect x="288" y="238" width="6" height="120"/>
        <rect x="324" y="238" width="6" height="120"/>
        <rect x="492" y="238" width="6" height="120"/>
        <rect x="528" y="238" width="6" height="120"/>
      </g>

      <!-- ground floor glazing -->
      <rect x="240" y="410" width="240" height="162" rx="3" fill="url(#hv-glass)"/>
      <rect x="240" y="410" width="240" height="162" rx="3" fill="#FFFFFF" opacity=".07"/>
      <g stroke="#F4EADA" stroke-width="3" opacity=".45">
        <path d="M320 410v162M400 410v162"/>
      </g>
      <path d="M240 410h74l-56 162h-18z" fill="#FFFFFF" opacity=".09"/>
      <!-- entrance portal -->
      <rect x="504" y="398" width="154" height="174" fill="#0C2B21" opacity=".16"/>
      <rect x="524" y="420" width="114" height="152" rx="2" fill="url(#hv-warm)"/>
      <rect x="574" y="440" width="16" height="132" rx="2" fill="#123A2C" opacity=".4"/>
      <circle cx="598" cy="508" r="4" fill="#123A2C" opacity=".6"/>
      <rect x="486" y="446" width="14" height="56" rx="4" fill="#B0854A"/>
      <!-- side window -->
      <rect x="686" y="434" width="112" height="138" rx="3" fill="url(#hv-glass)"/>
      <g stroke="#F4EADA" stroke-width="3" opacity=".4"><path d="M742 434v138"/></g>
    </g>

    <!-- hedges seated on ground -->
    <g fill="#2F5C46">
      <rect x="140" y="562" width="50" height="42" rx="16" opacity=".92"/>
      <rect x="828" y="562" width="50" height="42" rx="16" opacity=".92"/>
      <rect x="1062" y="558" width="52" height="46" rx="18" opacity=".9"/>
    </g>

    <!-- lawn texture -->
    <g opacity=".45" stroke="#8FA889" stroke-width="3" stroke-linecap="round">
      <path d="M52 646h140M28 676h190M900 648h180M948 678h200M240 664h120"/>
    </g>

    <!-- reflecting water court -->
    <g clip-path="url(#hv-pool)">
      <rect x="0" y="702" width="1200" height="158" fill="url(#hv-water)"/>
      <!-- mirrored villa smear -->
      <g opacity=".38" filter="url(#hv-blur6)">
        <rect x="196" y="702" width="622" height="96" fill="#EDE3D2"/>
        <rect x="240" y="702" width="240" height="72" fill="#0C2B21"/>
        <rect x="524" y="702" width="114" height="82" fill="#F3BF63"/>
        <rect x="686" y="702" width="112" height="66" fill="#0C2B21"/>
        <rect x="812" y="702" width="242" height="80" fill="#DCCCB2"/>
        <rect x="840" y="702" width="78" height="58" fill="#0C2B21"/>
      </g>
      <g stroke="#EAF1EC" stroke-width="3" opacity=".45" stroke-linecap="round">
        <path d="M60 742h180M320 758h150M540 736h210M820 764h190M120 792h240M640 800h200M400 818h180"/>
      </g>
      <rect x="0" y="702" width="1200" height="8" fill="#E6DBC6" opacity=".9"/>
    </g>

    <!-- stepping stones over water -->
    <g fill="url(#hv-stone)">
      <rect x="524" y="712" width="152" height="24" rx="4"/>
      <rect x="516" y="750" width="168" height="26" rx="4"/>
      <rect x="506" y="792" width="188" height="28" rx="4"/>
      <rect x="496" y="836" width="208" height="24" rx="4"/>
    </g>
    <g fill="#0C2B21" opacity=".18">
      <rect x="524" y="736" width="152" height="6" rx="3"/>
      <rect x="516" y="776" width="168" height="6" rx="3"/>
      <rect x="506" y="820" width="188" height="6" rx="3"/>
    </g>

    <!-- foreground palm right -->
    <g>
      <path d="M1128 860c-10-96 6-186 34-262" stroke="#7A6A4F" stroke-width="15" fill="none" stroke-linecap="round"/>
      <g fill="#224836">
        <path d="M1162 592c-58-26-114-16-150 22 54-4 100 8 132 34z"/>
        <path d="M1162 592c-16-62-58-100-108-110 32 42 46 88 44 130z"/>
        <path d="M1162 592c44-48 96-64 148-52-46 18-82 48-104 84z"/>
        <path d="M1162 592c62-6 110 18 138 66-50-26-98-32-140-20z"/>
        <path d="M1162 592c2-56 30-102 74-128-24 46-34 92-30 134z"/>
      </g>
      <circle cx="1162" cy="592" r="10" fill="#35624B"/>
    </g>

    <!-- foreground planter left -->
    <g>
      <path d="M38 860l12-84h104l12 84z" fill="#DFD0B4"/>
      <rect x="44" y="770" width="116" height="12" rx="5" fill="#EFE5D3"/>
      <g fill="#2F5C46">
        <path d="M102 770c-30-8-46-32-44-64 26 16 42 38 44 64z"/>
        <path d="M102 770c30-8 46-32 44-64-26 16-42 38-44 64z"/>
        <path d="M102 770c-6-38 6-70 34-92-8 34-16 64-34 92z"/>
        <path d="M102 770c6-38-6-70-34-92 8 34 16 64 34 92z"/>
      </g>
    </g>

    <!-- birds -->
    <g stroke="#8B9A86" stroke-width="3" fill="none" opacity=".65" stroke-linecap="round">
      <path d="M176 194c8-8 16-8 24 0M208 180c8-8 16-8 24 0M192 226c6-6 12-6 18 0"/>
    </g>

    <rect width="1200" height="860" fill="url(#hv-vig)"/>
  </g>
</svg>
