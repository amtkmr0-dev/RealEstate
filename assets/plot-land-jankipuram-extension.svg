<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"
     aria-label="Illustration of surveyed residential plots marked out either side of a paved approach road, with corner boundary stones and young avenue trees">
  <title>Surveyed residential plots either side of a paved approach road</title>
  <defs>
    <linearGradient id="pl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD3AC"/>
      <stop offset=".5" stop-color="#F7EEDF"/>
      <stop offset="1" stop-color="#EAEEE5"/>
    </linearGradient>
    <linearGradient id="pl-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD9C2"/>
      <stop offset="1" stop-color="#A6BC9E"/>
    </linearGradient>
    <linearGradient id="pl-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BCAF9A"/>
      <stop offset="1" stop-color="#9C8F79"/>
    </linearGradient>
    <linearGradient id="pl-plot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6D3"/>
      <stop offset="1" stop-color="#C4D3B9"/>
    </linearGradient>
    <radialGradient id="pl-vig" cx=".5" cy=".45" r=".76">
      <stop offset=".58" stop-color="#3A2E18" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2E18" stop-opacity=".16"/>
    </radialGradient>
  </defs>

  <rect width="800" height="560" fill="url(#pl-sky)"/>
  <circle cx="150" cy="88" r="40" fill="#FFE9BC" opacity=".75"/>
  <g fill="#FFFFFF" opacity=".42">
    <ellipse cx="470" cy="92" rx="140" ry="16"/>
    <ellipse cx="300" cy="128" rx="100" ry="12"/>
  </g>

  <!-- distant skyline of a growing suburb -->
  <g fill="#BFC9BB" opacity=".8">
    <rect x="88" y="212" width="24" height="62" rx="3"/>
    <rect x="118" y="196" width="17" height="78" rx="3"/>
    <rect x="141" y="224" width="21" height="50" rx="3"/>
    <rect x="618" y="204" width="20" height="70" rx="3"/>
    <rect x="643" y="222" width="28" height="52" rx="3"/>
    <rect x="676" y="212" width="16" height="62" rx="3"/>
  </g>
  <path d="M0 252c56-14 88 6 132-4s70-18 114-8 66 18 112 4 80-14 126-2 74 16 118 2l198-6v36H0z"
        fill="#8FA989" opacity=".5"/>

  <rect x="0" y="276" width="800" height="284" fill="url(#pl-ground)"/>
  <path d="M0 276h800v8H0z" fill="#8FA989" opacity=".55"/>

  <!-- approach road in perspective -->
  <path d="M338 276h124l188 284H150z" fill="url(#pl-road)"/>
  <path d="M338 276h124l6 10H332z" fill="#8C806B"/>
  <g stroke="#F7F2E6" stroke-width="8" stroke-dasharray="28 26" opacity=".9">
    <path d="M400 292v268"/>
  </g>
  <!-- kerbs, tracking the road edges -->
  <path d="M338 276h10L174 560h-24z" fill="#DED2BB" opacity=".9"/>
  <path d="M462 276h-10L626 560h24z" fill="#DED2BB" opacity=".9"/>

  <!-- plot blocks, left -->
  <g>
    <path d="M28 306h276l-30 66H10z" fill="url(#pl-plot)" stroke="#123A2C" stroke-width="3"/>
    <path d="M10 372h270l-36 82H-14z" fill="url(#pl-plot)" stroke="#123A2C" stroke-width="3"/>
    <g stroke="#123A2C" stroke-width="2.5" opacity=".5">
      <path d="M118 306l-14 66M208 306l-18 66M100 372l-22 82M190 372l-26 82"/>
    </g>
  </g>
  <!-- plot blocks, right -->
  <g>
    <path d="M496 306h276l30 66H526z" fill="url(#pl-plot)" stroke="#123A2C" stroke-width="3"/>
    <path d="M526 372h270l36 82H562z" fill="url(#pl-plot)" stroke="#123A2C" stroke-width="3"/>
    <g stroke="#123A2C" stroke-width="2.5" opacity=".5">
      <path d="M588 306l12 66M678 306l16 66M614 372l20 82M704 372l24 82"/>
    </g>
  </g>

  <!-- corner boundary stones, seated on the plot corners -->
  <g>
    <g fill="#F2E8D6" stroke="#123A2C" stroke-width="2.5">
      <path d="M22 306h14l3 20H19z"/>
      <path d="M290 306h14l3 20h-20z"/>
      <path d="M496 306h14l3 20h-20z"/>
      <path d="M764 306h14l3 20h-20z"/>
    </g>
    <g fill="#B0854A">
      <rect x="20" y="300" width="18" height="6" rx="3"/>
      <rect x="288" y="300" width="18" height="6" rx="3"/>
      <rect x="494" y="300" width="18" height="6" rx="3"/>
      <rect x="762" y="300" width="18" height="6" rx="3"/>
    </g>
  </g>

  <!-- saplings flanking the far end of the road -->
  <g>
    <g><rect x="310" y="262" width="5" height="46" fill="#7A6248"/><circle cx="312" cy="256" r="16" fill="#3D6B4F"/></g>
    <g><rect x="486" y="262" width="5" height="46" fill="#7A6248"/><circle cx="488" cy="256" r="16" fill="#3D6B4F"/></g>
  </g>

  <!-- boundary hedge along the outer edges -->
  <g fill="#2F5C46" opacity=".9">
    <rect x="-10" y="452" width="200" height="18" rx="9"/>
    <rect x="620" y="452" width="200" height="18" rx="9"/>
  </g>

  <!-- foreground grass -->
  <g stroke="#93AA8C" stroke-width="3" opacity=".5" stroke-linecap="round">
    <path d="M42 512h130M6 542h150M628 516h160M610 546h190"/>
  </g>

  <!-- foreground framing trees, bottom corners -->
  <g>
    <rect x="20" y="416" width="14" height="144" rx="5" fill="#6E5941"/>
    <circle cx="27" cy="404" r="52" fill="#2A5540"/>
    <circle cx="-8" cy="428" r="34" fill="#33654C"/>
    <circle cx="66" cy="426" r="30" fill="#33654C"/>
  </g>
  <g>
    <rect x="768" y="416" width="14" height="144" rx="5" fill="#6E5941"/>
    <circle cx="775" cy="404" r="50" fill="#2A5540"/>
    <circle cx="810" cy="428" r="32" fill="#33654C"/>
    <circle cx="736" cy="426" r="28" fill="#33654C"/>
  </g>

  <rect width="800" height="560" fill="url(#pl-vig)"/>
</svg>
