<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img"
     aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Stylised map of north Lucknow corridors</title>
  <desc id="mapDesc">A simplified diagram showing three pins in north Lucknow: Jankipuram Extension, Sitapur Road and Kursi Road, radiating outward from central Lucknow, with the Gomti river shown across the lower half.</desc>
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1E5"/>
      <stop offset="1" stop-color="#EFE9DB"/>
    </linearGradient>
    <linearGradient id="mp-river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C4CB"/>
      <stop offset="1" stop-color="#8FB2BC"/>
    </linearGradient>
  </defs>

  <rect width="720" height="560" rx="24" fill="url(#mp-bg)"/>

  <!-- subtle grid -->
  <g stroke="#D9CFBC" stroke-width="1" opacity=".8">
    <path d="M0 80h720M0 160h720M0 240h720M0 320h720M0 400h720M0 480h720"/>
    <path d="M90 0v560M180 0v560M270 0v560M360 0v560M450 0v560M540 0v560M630 0v560"/>
  </g>

  <!-- green belts -->
  <g fill="#CBDAC2" opacity=".75">
    <ellipse cx="112" cy="130" rx="86" ry="56"/>
    <ellipse cx="612" cy="184" rx="76" ry="52"/>
    <ellipse cx="176" cy="454" rx="96" ry="46"/>
  </g>

  <!-- Gomti river -->
  <path d="M-10 396c96-8 148 34 236 30s142-42 232-30 178 44 272 22" fill="none"
        stroke="url(#mp-river)" stroke-width="26" stroke-linecap="round" opacity=".85"/>
  <text x="556" y="452" font-family="Manrope, system-ui, sans-serif" font-size="17" fill="#5C7C85">Gomti</text>

  <!-- ring road hint -->
  <path d="M360 470c-140 0-232-86-232-186S224 92 360 92s232 92 232 192" fill="none"
        stroke="#D3C4AA" stroke-width="10" stroke-dasharray="2 16" stroke-linecap="round" opacity=".9"/>

  <!-- corridors from city centre -->
  <g fill="none" stroke-linecap="round">
    <!-- Sitapur Road: straight north -->
    <path d="M360 430V96" stroke="#123A2C" stroke-width="13"/>
    <path d="M360 430V96" stroke="#B0854A" stroke-width="3" stroke-dasharray="16 14"/>
    <!-- Jankipuram Extension: north-west -->
    <path d="M360 430C310 350 268 296 190 214" stroke="#123A2C" stroke-width="12"/>
    <path d="M360 430C310 350 268 296 190 214" stroke="#B0854A" stroke-width="3" stroke-dasharray="16 14"/>
    <!-- Kursi Road: north-east -->
    <path d="M360 430C420 356 470 300 552 236" stroke="#123A2C" stroke-width="12"/>
    <path d="M360 430C420 356 470 300 552 236" stroke="#B0854A" stroke-width="3" stroke-dasharray="16 14"/>
  </g>

  <!-- city centre marker -->
  <g>
    <circle cx="360" cy="440" r="17" fill="#FDFBF6" stroke="#123A2C" stroke-width="5"/>
    <circle cx="360" cy="440" r="6" fill="#B0854A"/>
    <text x="360" y="492" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
          font-size="19" font-weight="700" fill="#123A2C">Lucknow city</text>
  </g>

  <!-- pins -->
  <g font-family="Manrope, system-ui, sans-serif">
    <!-- Jankipuram Extension -->
    <g>
      <path d="M190 214c-17 0-31 14-31 31 0 23 31 51 31 51s31-28 31-51c0-17-14-31-31-31z" fill="#123A2C"/>
      <circle cx="190" cy="245" r="11" fill="#F2E3C9"/>
      <text x="190" y="188" text-anchor="middle" font-size="19" font-weight="800" fill="#123A2C">Jankipuram</text>
      <text x="190" y="209" text-anchor="middle" font-size="16" font-weight="600" fill="#6E675E">Extension</text>
    </g>
    <!-- Sitapur Road -->
    <g>
      <path d="M360 68c-17 0-31 14-31 31 0 23 31 51 31 51s31-28 31-51c0-17-14-31-31-31z" fill="#123A2C"/>
      <circle cx="360" cy="99" r="11" fill="#F2E3C9"/>
      <text x="360" y="44" text-anchor="middle" font-size="19" font-weight="800" fill="#123A2C">Sitapur Road</text>
    </g>
    <!-- Kursi Road -->
    <g>
      <path d="M556 210c-17 0-31 14-31 31 0 23 31 51 31 51s31-28 31-51c0-17-14-31-31-31z" fill="#123A2C"/>
      <circle cx="556" cy="241" r="11" fill="#F2E3C9"/>
      <text x="556" y="184" text-anchor="middle" font-size="19" font-weight="800" fill="#123A2C">Kursi Road</text>
    </g>
  </g>

  <!-- compass -->
  <g transform="translate(650 76)">
    <circle r="28" fill="#FDFBF6" stroke="#D9CFBC" stroke-width="2"/>
    <path d="M0-19 7 4 0-2-7 4z" fill="#123A2C"/>
    <text y="-30" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
          font-size="14" font-weight="800" fill="#123A2C">N</text>
  </g>

  <!-- legend -->
  <g transform="translate(28 512)" font-family="Manrope, system-ui, sans-serif">
    <rect x="-8" y="-22" width="330" height="34" rx="17" fill="#FDFBF6" opacity=".92"/>
    <circle cx="12" cy="-5" r="6" fill="#123A2C"/>
    <text x="28" y="0" font-size="15" fill="#4A5850">Corridors Deepika covers · not to scale</text>
  </g>
</svg>
